[workspace]
resolver = "2"
members = [
    "bins/*",
    "crates/*",
    "benches/*",
]

[workspace.package]
edition = "2024"

# Optimize the SIMD-heavy pixel/parse crates even in dev builds. Their hot
# paths are hand-written SSE2/AVX2 intrinsic loops (premultiply, cell-store
# widening, parser scan); unoptimized, every `_mm_*` intrinsic degrades to a
# non-inlined, bounds-checked function call, making them ~100x slower than
# release -- e.g. the monitor's per-frame premultiply measured 67ms in a debug
# build vs 0.6ms optimized, pinning a whole core (~65% CPU) just from running
# `cargo run` without `--release`. The kernels are numerically identical across
# opt-levels (proven by premultiply's exhaustive div255 + oracle tests), so
# optimizing only these crates in dev carries no correctness risk and leaves
# the rest of the workspace fully debuggable with a fast edit-compile loop.
[profile.dev.package.platform]
opt-level = 3

[profile.dev.package.grid]
opt-level = 3

[profile.dev.package.vt_parser]
opt-level = 3

[workspace.dependencies]
# 0.15.1 adds MsgFlags::CMSG_CLOEXEC, required by `crates/scm-rights`.
ququmatz      = "0.15.1"
# Must come from the registry, not a path: quetzal-uring's own ququmatz
# dependency would otherwise resolve to a second, distinct copy of the crate.
quetzal-uring = "0.2.1"
# Must come from the registry, not a path: quetzal-uring depends on
# quetzalcoatl too, and a path copy resolves as a second, distinct crate.
quetzalcoatl  = "0.13.1"
shelby        = { path = "/home/cuarentaydos/Code/tooling/shelby/crates/shelby", features = ["std"] }
json-bourne   = { path = "/home/cuarentaydos/Code/tooling/bourne/crates/bourne", features = ["derive"] }
# Zero-dependency PNG encode/decode, shared by `bins/wallpaper` (decode, for
# loading a wallpaper image) and any future `bins/shot`-style screenshot tool
# (encode) -- see its own doc comment for why it exists as a standalone
# `tooling/` crate rather than something reinvented per bin.
ixiptla-core  = { path = "/home/cuarentaydos/Code/tooling/ixiptla/crates/ixiptla-core" }

[workspace.lints.clippy]
# groups
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
perf     = { level = "warn", priority = -1 }
style    = { level = "warn", priority = -1 }

# doc-related allowances
missing_docs_in_private_items = "allow"
missing_errors_doc            = "allow"
missing_panics_doc            = "allow"

# Every `unsafe` block in this workspace is expected to carry a `// SAFETY:`
# comment explaining the invariant that makes it sound -- a convention
# already followed everywhere by hand (see the 2026-07-30 unsafe audit).
# Promoting it from convention to a real lint means a future unsafe block
# added without one fails CI instead of relying on a reviewer noticing.
undocumented_unsafe_blocks = "warn"
