[package]
name        = "monitor-benches"
version     = "0.1.0"
edition.workspace = true
publish     = false
description = "divan micro-benchmarks (cycles + allocations) for the monitor dashboard's headless paint/data paths: chart surfaces, per-core bars, damage coalescing, and the redraw gate"

[lints]
workspace = true

[dependencies]
monitor   = { path = "../../bins/monitor" }
platform  = { path = "../../crates/platform" }
statusbar = { path = "../../crates/statusbar" }
divan     = "0.1"

[[bench]]
name    = "chart"
harness = false

[[bench]]
name    = "core_bars"
harness = false

[[bench]]
name    = "damage"
harness = false

[[bench]]
name    = "idle_tick"
harness = false

[[bench]]
name    = "blend"
harness = false
