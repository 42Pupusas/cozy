[package]
name        = "tty-benches"
version     = "0.1.0"
edition.workspace = true
publish     = false
description = "divan micro-benchmarks (cycles + allocations) for the tty pipeline: vt_parser -> grid -> platform, plus text_layout and input"

[lints]
workspace = true

[dependencies]
vt_parser   = { path = "../../crates/vt_parser" }
grid        = { path = "../../crates/grid" }
platform    = { path = "../../crates/platform" }
text_layout = { path = "../../crates/text_layout" }
input       = { path = "../../crates/input" }
quetzalcoatl = { workspace = true }
divan       = "0.1"

[[bench]]
name    = "parser"
harness = false

[[bench]]
name    = "pipeline"
harness = false

[[bench]]
name    = "snapshot"
harness = false

[[bench]]
name    = "blit"
harness = false

[[bench]]
name    = "scrollback"
harness = false

[[bench]]
name    = "layout"
harness = false

[[bench]]
name    = "input"
harness = false

[[bench]]
name    = "transport"
harness = false
