[package]
name    = "files-bin"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "files"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The directory model: read, filter, sort. No UI knowledge at all.
fsmodel  = { path = "../../crates/fsmodel" }
# The list/scroll/selection/text widgets. No platform knowledge at all.
widget   = { path = "../../crates/widget" }
# The window: xdg-shell toplevel, input, and a software canvas.
platform = { path = "../../crates/platform" }
# `TextRenderer`: scalable font loading with bitmap fallback, shared with the
# bar/launcher/monitor rather than reimplemented, so the browser's type scale
# behaves identically to theirs.
statusbar = { path = "../../crates/statusbar" }
# The `[files]` table, and the terminal palette its unset keys mirror.
config   = { path = "../../crates/config" }
waker    = { path = "../../crates/waker" }
# Civil local time for the `modified` column, shared with the bar and the
# trash implementation rather than reimplementing timezone handling here.
localtime = { path = "../../crates/localtime" }
# Raw filesystem capacity figures (`statvfs`) for the sidebar's storage
# footer, shared with `sysmon` rather than reimplementing the same FFI
# struct here.
diskstat  = { path = "../../crates/diskstat" }
# Type detection and type->application association, so opening a file is a
# real desktop-entry resolution rather than a shell-out to xdg-open.
mime     = { path = "../../crates/mime" }
# "Which application opens this file, and with what argv?" -- the same
# resolution policy `bins/open` and the portal's OpenURI use.
opener   = { path = "../../crates/opener" }
# Copy/move for drag-and-drop drops: moving files onto a folder row is a
# real filesystem mutation (cross-filesystem fallback, conflict policy),
# not a bare `std::fs::rename` call.
fileops  = { path = "../../crates/fileops" }
# The XDG user directories the sidebar's "places" section lists, shared with
# `bins/xdg-user-dirs` so the reader and the writer cannot disagree about the
# `user-dirs.dirs` format.
user-dirs = { path = "../../crates/user-dirs" }
headless-stress = { path = "../../crates/headless-stress" }
