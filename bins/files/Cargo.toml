[package]
name    = "files-bin"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "files"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The directory model: read, filter, sort. No UI knowledge at all.
fsmodel  = { path = "../../crates/fsmodel" }
# The list/scroll/selection/text widgets. No platform knowledge at all.
widget   = { path = "../../crates/widget" }
# The window: xdg-shell toplevel, input, and a software canvas.
platform = { path = "../../crates/platform" }
# `TextRenderer`: scalable font loading with bitmap fallback, shared with the
# bar/launcher/monitor rather than reimplemented, so the browser's type scale
# behaves identically to theirs.
statusbar = { path = "../../crates/statusbar" }
# The `[files]` table, and the terminal palette its unset keys mirror.
config   = { path = "../../crates/config" }
waker    = { path = "../../crates/waker" }
# Type detection and type->application association, so opening a file is a
# real desktop-entry resolution rather than a shell-out to xdg-open.
mime     = { path = "../../crates/mime" }
# `.desktop` parsing and `Exec=` expansion, shared with `bins/launcher`
# rather than reimplemented: "open this file with that app" and "launch
# that app" are the same command-building problem.
launcher = { path = "../../crates/launcher" }
