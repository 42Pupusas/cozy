[package]
name    = "launcher-bin"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "launcher"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
launcher  = { path = "../../crates/launcher" }
statusbar = { path = "../../crates/statusbar" }
platform  = { path = "../../crates/platform" }
config    = { path = "../../crates/config" }
waker        = { path = "../../crates/waker" }
quetzalcoatl = { workspace = true }
# App-icon decoding only -- see `icon_cache.rs`'s doc for why this is the
# one place this binary touches a PNG decoder at all.
ixiptla-core = { workspace = true }
headless-stress = { path = "../../crates/headless-stress" }
