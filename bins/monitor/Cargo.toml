[package]
name = "monitor"
version = "0.1.0"
edition.workspace = true

[lib]
name = "monitor"
path = "src/lib.rs"

[[bin]]
name = "monitor"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Forwards platform's opt-in frame-pacing instrumentation (present-busy
# sub-phase timing, TERMINAL_DEBUG_FPS=log) so the dashboard's own paint-only
# MONITOR_PROFILE numbers can be cross-checked against what actually costs
# time in TermWindow::maybe_present -- the blit/overlay/shm-copy/submit work
# that happens after the painter closure returns and that MONITOR_PROFILE's
# PaintPhases timer structurally cannot see.
trace = ["platform/trace"]

[dependencies]
headless-stress = { path = "../../crates/headless-stress" }
sysmon = { path = "../../crates/sysmon" }
statusbar = { path = "../../crates/statusbar" }
platform = { path = "../../crates/platform" }
config = { path = "../../crates/config" }
waker = { path = "../../crates/waker" }
