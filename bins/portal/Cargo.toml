[package]
name    = "portal-bin"
version = "0.1.0"
edition.workspace = true

[lib]
name = "portal_bin"
path = "src/lib.rs"

[[bin]]
name = "portal"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
dbus        = { path = "../../crates/dbus" }
dbus-server = { path = "../../crates/dbus-server" }
portal-core = { path = "../../crates/portal-core" }
config      = { path = "../../crates/config" }
opener      = { path = "../../crates/opener" }
waker        = { path = "../../crates/waker" }
ququmatz     = { workspace = true }
quetzalcoatl = { workspace = true }
# Shared unaligned-read loop over a raw inotify(7) buffer, shared with
# bins/terminal rather than each hand-rolling its own copy of the same
# kernel-defined event parsing.
inotify-events = { path = "../../crates/inotify-events" }
