[package]
name    = "terminal"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
config       = { path = "../../crates/config" }
grid         = { path = "../../crates/grid" }
input        = { path = "../../crates/input" }
platform     = { path = "../../crates/platform" }
pty          = { path = "../../crates/pty" }
tlog         = { path = "../../crates/tlog" }
vt_parser    = { path = "../../crates/vt_parser" }
waker        = { path = "../../crates/waker" }
quetzalcoatl = { workspace = true }
ququmatz     = { workspace = true }
# Shared unaligned-read loop over a raw inotify(7) buffer, shared with
# bins/portal rather than each hand-rolling its own copy of the same
# kernel-defined event parsing.
inotify-events = { path = "../../crates/inotify-events" }
headless-stress = { path = "../../crates/headless-stress" }

[features]
trace = ["tlog/trace", "platform/trace"]
