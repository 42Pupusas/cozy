[package]
name    = "mime"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
# No path deps, by design -- same rationale as `crates/fsmodel`. This crate
# answers "what type is this file, and which app opens it?" purely from the
# shared-mime-info database and `.desktop` metadata on disk, with zero
# Wayland/rendering knowledge. That keeps it headlessly unit-testable and
# reusable by `bins/files`, and later by a portal FileChooser/OpenURI impl.
#
# Note it deliberately does NOT depend on `crates/launcher`, even though
# both parse `.desktop` files: launcher owns *app discovery by name*, this
# owns *type -> handler association*. Wiring the two together is the
# consumer's job (bins/files), so neither crate drags the other in.
