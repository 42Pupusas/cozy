[package]
name    = "platform"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[features]
# Compile-in extra render observability (e.g. the scrollback pixel-shift
# counters on `Renderer`, read by regression tests and the FPS debug log).
# Off by default so release builds carry zero extra per-frame state.
trace = []

[dependencies]
grid         = { path = "../grid" }
vt_parser    = { path = "../vt_parser" }
config       = { path = "../config" }
font         = { path = "../font" }
waker        = { path = "../waker" }
quetzalcoatl = { workspace = true }
ququmatz     = { workspace = true }
xkb          = { path = "../xkb" }

# NOTE: quetzal-uring is intentionally absent for now.
# The platform event loop is driven by a blocking SPSC pop + a raw Wayland
# socket polled via ququmatz EventFd.  We wire up demux::Router in M7
# when we add the GPU render path.
