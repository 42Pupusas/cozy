[package]
name    = "volumes"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
# No Wayland, rendering or daemon dependencies, by design -- same rule as
# `crates/fsmodel`. This crate turns the kernel's own mount and block-device
# tables into a list of storage volumes.
#
# Notably it does NOT depend on `crates/dbus`: UDisks2 is not required to
# *detect* storage, and building on the kernel's tables means detection works
# on machines where that daemon is absent. `MountSource` is the seam through
# which a UDisks2-backed implementation can be added later.

# Both for `DeviceSignals`: an inotify watch on udev's block records, so a
# device appearing is an event rather than a poll.
ququmatz       = { workspace = true }
inotify-events = { path = "../inotify-events" }

[dev-dependencies]
# Only to wait on the live mount table in a test, the way the file browser does.
waker = { path = "../waker" }
