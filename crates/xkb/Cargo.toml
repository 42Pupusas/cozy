[package]
name    = "xkb"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
# No path deps: this crate speaks only libxkbcommon's C ABI (dlopen'd at
# runtime, matching the workspace's "no build.rs, no bindgen" rule — see
# PLAN.md) and hands callers back plain u32 keysyms / chars. Callers (the
# `platform`/terminal-bin layer) translate keysyms into `input::Key`, so this
# crate doesn't need to depend on `input` either.
