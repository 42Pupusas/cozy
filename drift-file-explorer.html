<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drift</title>
<style>
:root{--bg:#0d0f12;--panel:#111419;--panel2:#15191f;--line:#242a32;--fg:#d8dee9;--muted:#69727f;--accent:#9ece6a;--accent2:#1c291c;--blue:#7aa2f7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090b0d;color:var(--fg);font:13px/1.4 "JetBrains Mono","Iosevka","Cascadia Code",monospace;display:grid;place-items:center;padding:24px}button,input{font:inherit;color:inherit}.app{width:min(1280px,97vw);height:min(790px,94vh);min-height:610px;display:grid;grid-template-columns:210px 1fr;background:var(--bg);border:1px solid var(--line);box-shadow:0 22px 70px #0009;overflow:hidden}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;min-height:0}.label{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:#4f5864;margin:15px 9px 6px}.nav{width:100%;height:34px;border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:0 9px;color:#7f8996;cursor:pointer;text-align:left;border-left:2px solid transparent}.nav svg{width:15px;height:15px}.nav:hover{color:var(--fg);background:#171b21}.nav.active{color:var(--accent);background:var(--accent2);border-left-color:var(--accent)}.nav .meta{margin-left:auto;font-size:10px;color:#505965}.storage{margin-top:auto;padding:14px 9px 2px;border-top:1px solid var(--line)}.storage-top{display:flex;justify-content:space-between;color:#6d7682;font-size:10px;margin-bottom:9px}.bar{height:2px;background:#272d35}.bar i{display:block;width:61%;height:100%;background:var(--accent)}.main{min-width:0;display:flex;flex-direction:column}.toolbar{height:58px;display:flex;align-items:center;gap:9px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg)}.icon{width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;color:#646e7b;cursor:pointer}.icon:hover{color:var(--fg);background:var(--panel2)}.icon svg{width:16px}.path{display:flex;align-items:center;margin-left:5px;white-space:nowrap}.path button{border:0;background:transparent;padding:5px 7px;color:#7c8692;cursor:pointer}.path button:last-child{color:var(--fg)}.path button:hover{background:var(--panel2)}.slash{color:#39414b}.spacer{flex:1}.search{width:200px;height:31px;border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 9px;background:#101318;transition:.18s}.search:focus-within{width:245px;border-color:#465243}.search svg{width:14px;color:#59626e}.search input{border:0;outline:0;background:transparent;min-width:0;width:100%;color:var(--fg)}.search input::placeholder{color:#4d5661}.view-toggle{display:flex;border:1px solid var(--line);height:31px}.view-toggle button{width:31px;border:0;background:transparent;color:#56606c;display:grid;place-items:center;cursor:pointer}.view-toggle button.active{background:#20262d;color:var(--accent)}.view-toggle svg{width:14px}.content{padding:24px 22px 0;min-height:0;display:flex;flex-direction:column}.heading{display:flex;align-items:center;margin-bottom:18px}.heading h1{font-size:16px;margin:0;color:#e5e9ef;font-weight:600}.heading .count{margin-left:10px;color:#4e5864;font-size:10px}.sort{margin-left:auto;border:0;background:transparent;color:#59636f;font-size:10px;cursor:pointer}.table-wrap{overflow:auto;min-height:0}.files{width:100%;border-collapse:collapse;table-layout:fixed}.files th{text-align:left;height:30px;color:#4d5662;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;font-weight:500;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}.files th:first-child{padding-left:8px}.files th:nth-child(1){width:53%}.files th:nth-child(2){width:20%}.files th:nth-child(3){width:17%}.files th:nth-child(4){width:10%}.files td{height:49px;border-bottom:1px solid #191e24;color:#69737f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.files td:first-child{padding-left:8px}.files tbody tr:hover td{background:#12161b}.files tr.selected td{background:#192319;color:#8eaa7d}.name{display:flex;align-items:center;gap:12px;color:#bdc5cf;min-width:0}.selected .name{color:var(--accent)}.name span:last-child{overflow:hidden;text-overflow:ellipsis}.file-icon{width:23px;height:23px;display:grid;place-items:center;color:#727c89}.file-icon svg{width:18px;height:18px}.file-icon.folder{color:var(--blue)}.file-icon.image{color:#bb9af7}.file-icon.doc{color:#7dcfff}.file-icon.video{color:#f7768e}.file-icon.archive{color:#e0af68}.grid{display:none;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;overflow:auto}.grid.show{display:grid}.card{height:114px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;color:#9ba5b1;cursor:default}.card:hover{border-color:var(--line);background:#12161b}.card.selected{border-color:#31402d;background:var(--accent2);color:var(--accent)}.card .file-icon{width:34px;height:34px}.card .file-icon svg{width:28px;height:28px}.card-name{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.status{height:35px;margin-top:auto;border-top:1px solid var(--line);display:flex;align-items:center;color:#46505c;font-size:9px;letter-spacing:.4px}.status .right{margin-left:auto}.kbd{border:1px solid #2a3038;padding:2px 5px;color:#65707d}.hidden{display:none!important}.toast{position:absolute;bottom:40px;left:50%;transform:translate(-50%,15px);padding:9px 13px;background:#1a201a;border:1px solid #354431;color:var(--accent);opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.app{position:relative}
@media(max-width:780px){body{padding:0}.app{width:100vw;height:100vh;grid-template-columns:58px 1fr;border:0}.sidebar{padding:16px 8px}.nav span,.label,.storage{display:none}.nav{justify-content:center;padding:0}.search{width:32px}.search input{display:none}.files th:nth-child(2),.files td:nth-child(2){display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="label" style="margin-top:0">places</div>
 <button class="nav active" data-place="home">⌂<span>home</span></button>
 <button class="nav" data-place="documents">▱<span>documents</span></button>
 <button class="nav" data-place="downloads">↓<span>downloads</span><span class="meta">3</span></button>
 <button class="nav" data-place="pictures">◇<span>pictures</span></button>
 <button class="nav" data-place="videos">▷<span>videos</span></button>
 <div class="label">mounts</div>
 <button class="nav" data-place="system">▣<span>system</span><span class="meta">128g</span></button>
 <button class="nav" data-place="backup">▤<span>backup</span><span class="meta">1t</span></button>
 <div class="label">tags</div>
 <button class="nav"><b style="color:#f7768e">●</b><span>important</span></button>
 <button class="nav"><b style="color:#e0af68">●</b><span>active</span></button>
 <div class="storage"><div class="storage-top"><span>/dev/nvme0n1</span><span>61%</span></div><div class="bar"><i></i></div></div>
</aside>
<main class="main">
 <div class="toolbar">
  <button class="icon" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 18-6-6 6-6"/></svg></button>
  <button class="icon" aria-label="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 18 6-6-6-6"/></svg></button>
  <div class="path"><button>~</button><span class="slash">/</span><button id="crumb">home</button></div>
  <div class="spacer"></div>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><input id="search" placeholder="filter..." autocomplete="off"></label>
  <div class="view-toggle"><button id="listBtn" class="active" title="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button><button id="gridBtn" title="grid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg></button></div>
  <button class="icon" id="newBtn" title="new folder">＋</button>
 </div>
 <section class="content">
  <div class="heading"><h1 id="heading">home</h1><span class="count" id="count">8 entries</span><button class="sort">modified ↓</button></div>
  <div class="table-wrap" id="tableWrap"><table class="files"><thead><tr><th>name</th><th>modified</th><th>kind</th><th>size</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="grid" id="grid"></div>
  <div class="status"><span id="status">8 entries</span><span class="right">select all&nbsp; <span class="kbd">ctrl+a</span></span></div>
 </section>
</main><div class="toast" id="toast">directory created</div>
</div>
<script>
const I={folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h7l2 2h9v11H3z"/></svg>',image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16"/><circle cx="9" cy="10" r="2"/><path d="m4 18 5-5 4 4 2-2 5 4"/></svg>',doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 3h9l5 5v13H5zM14 3v6h5"/></svg>',video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="14"/><path d="m10 9 5 3-5 3z"/></svg>',archive:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16v5H4zM5 9h14v11H5zM10 13h4"/></svg>'};
let F=[['projects','folder','directory','today 14:22','—'],['documents','folder','directory','yesterday','—'],['pictures','folder','directory','jul 26','—'],['design-system.fig','image','design file','today 11:47','24.8m'],['q3-planning.pdf','doc','pdf','yesterday','3.2m'],['demo-recording.mp4','video','mpeg-4','jul 25','184m'],['notes.md','doc','markdown','jul 23','8k'],['website-backup.tar.gz','archive','archive','jul 20','91m']];let sel=-1;
const rows=document.querySelector('#rows'),grid=document.querySelector('#grid'),search=document.querySelector('#search');
function render(){let q=search.value.toLowerCase(),shown=F.filter(f=>f[0].includes(q));rows.innerHTML=shown.map(f=>`<tr data-n="${f[0]}" class="${F.indexOf(f)==sel?'selected':''}"><td><div class="name"><i class="file-icon ${f[1]}">${I[f[1]]}</i><span>${f[0]}</span></div></td><td>${f[3]}</td><td>${f[2]}</td><td>${f[4]}</td></tr>`).join('');grid.innerHTML=shown.map(f=>`<div data-n="${f[0]}" class="card ${F.indexOf(f)==sel?'selected':''}"><i class="file-icon ${f[1]}">${I[f[1]]}</i><span class="card-name">${f[0]}</span></div>`).join('');count.textContent=shown.length+' entries';status.textContent=sel<0?shown.length+' entries':'1 selected';document.querySelectorAll('[data-n]').forEach(x=>x.onclick=()=>{sel=F.findIndex(f=>f[0]==x.dataset.n);render()})}render();search.oninput=()=>{sel=-1;render()};
gridBtn.onclick=()=>{grid.classList.add('show');tableWrap.classList.add('hidden');gridBtn.classList.add('active');listBtn.classList.remove('active')};listBtn.onclick=()=>{grid.classList.remove('show');tableWrap.classList.remove('hidden');listBtn.classList.add('active');gridBtn.classList.remove('active')};
document.querySelectorAll('.nav[data-place]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));b.classList.add('active');heading.textContent=b.dataset.place;crumb.textContent=b.dataset.place;sel=-1;search.value='';render()});
newBtn.onclick=()=>{F.unshift(['new-directory','folder','directory','now','—']);sel=0;render();toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)};
</script>
</body></html>
